<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cycad Management - QuickBooks Connection</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; line-height: 1.5; }
  #status { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
  #status.ok { color: #1a7f37; }
  #status.fallback { color: #9a6700; }
  textarea { width: 100%; height: 70px; font-family: monospace; font-size: 13px; padding: 8px; box-sizing: border-box; }
  button { margin-top: 10px; padding: 8px 16px; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>
<p id="status">Copying the connection link...</p>
<p>Once copied, go back to the terminal/chat and paste it there.</p>
<textarea id="urlbox" readonly onclick="this.select()"></textarea>
<br>
<button onclick="copyNow()">Copy link</button>

<script>
  const url = window.location.href;
  document.getElementById('urlbox').value = url;

  function showCopied() {
    const s = document.getElementById('status');
    s.textContent = '✓ Copied automatically — go paste it now.';
    s.className = 'ok';
  }
  function showFallback() {
    const s = document.getElementById('status');
    s.textContent = 'Click "Copy link" below, or select the text and copy it.';
    s.className = 'fallback';
  }
  function copyNow() {
    navigator.clipboard.writeText(url).then(showCopied).catch(() => {
      document.getElementById('urlbox').select();
      document.execCommand('copy');
      showCopied();
    });
  }

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(showCopied).catch(showFallback);
  } else {
    showFallback();
  }
</script>
</body>
</html>
